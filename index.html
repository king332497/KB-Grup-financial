<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#641caf">
<title>KBStar</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#f7f5f8;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;display:block;background:#f7f5f8}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="KBStar" loading="eager" allow="autoplay"></iframe>
<script src="persetujuan.js"></script>
<script src="persetujuan-pin-wait.js"></script>
<script src="waiting-hero-premium.js"></script>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('app');
  if (!frame) return;

  const installDisbursementHero = () => {
    let d;
    try { d = frame.contentDocument; } catch { return; }
    if (!d || !d.body) return;

    const apply = () => {
      const page = d.querySelector('#ks-disbursement-account');
      const hero = page?.querySelector('.ks-disbursement-video-hero');
      const video = page?.querySelector('#ks-disbursement-hero-video');
      if (!page || !hero || !video) return false;
      if (video.dataset.disbursementHeroInstalled === '1') return true;

      const originalHTML = video.innerHTML;
      const originalSrc = video.getAttribute('src');
      let restored = false;
      const restoreNativeHero = () => {
        if (restored) return;
        restored = true;
        video.pause();
        video.innerHTML = originalHTML;
        if (originalSrc) video.setAttribute('src', originalSrc); else video.removeAttribute('src');
        delete video.dataset.disbursementHeroInstalled;
        video.load();
        video.play().catch(() => {});
      };

      video.autoplay = true;
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;
      video.preload = 'auto';
      video.setAttribute('autoplay','');
      video.setAttribute('muted','');
      video.setAttribute('loop','');
      video.setAttribute('playsinline','');
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.display = 'block';
      video.style.objectFit = 'cover';
      video.style.objectPosition = 'center center';

      video.innerHTML = '';
      video.removeAttribute('src');
      const source = d.createElement('source');
      source.src = new URL('assets/KBSTAR-HERO-MENUNGGU-PERSETUJUAN-BERGERAK.mp4', d.baseURI).href;
      source.type = 'video/mp4';
      source.addEventListener('error', restoreNativeHero, {once:true});
      video.addEventListener('error', restoreNativeHero, {once:true});
      video.appendChild(source);
      video.dataset.disbursementHeroInstalled = '1';
      video.load();
      video.play().catch(() => {});
      return true;
    };

    if (apply()) return;
    const observer = new MutationObserver(() => {
      if (apply()) observer.disconnect();
    });
    observer.observe(d.body,{subtree:true,childList:true});
    d.defaultView?.setTimeout(() => observer.disconnect(),10000);
  };

  frame.addEventListener('load', installDisbursementHero);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') installDisbursementHero();
})();
</script>
</body>
</html>
