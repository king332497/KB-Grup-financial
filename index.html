<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#641caf">
<title>KBStar</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#f7f5f8;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;display:block;background:#f7f5f8}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="KBStar" loading="eager"></iframe>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('app');
  const install = () => {
    let d;
    try { d = frame.contentDocument; } catch { return; }
    if (!d || !d.head) return;

    const hero = d.querySelector('#kbstar-loan-hero .ks-disbursement-video-hero');
    if (!hero) return;

    const src = new URL('assets/hero-kb-bank-revisi-rapi.webp', d.baseURI).href;
    d.getElementById('ks-revisi-rapi-style')?.remove();
    d.getElementById('ks-revisi-rapi-hero')?.remove();

    const style = d.createElement('style');
    style.id = 'ks-revisi-rapi-style';
    style.textContent = `
      #kbstar-loan-hero .ks-disbursement-video-hero[data-hero-revision="rapi-v3"]{
        position:relative!important;
        width:100%!important;
        height:auto!important;
        min-height:0!important;
        aspect-ratio:1108/475!important;
        overflow:hidden!important;
        border-radius:18px!important;
        isolation:isolate!important;
        background:#16083d url("${src}") center/100% 100% no-repeat!important;
      }
      #kbstar-loan-hero [data-hero-revision="rapi-v3"] > .ks-disbursement-hero-video,
      #kbstar-loan-hero [data-hero-revision="rapi-v3"] > .ks-disbursement-video-name,
      #kbstar-loan-hero [data-hero-revision="rapi-v3"] > .ks-disbursement-video-name-mask,
      #kbstar-loan-hero [data-hero-revision="rapi-v3"] > .ks-disbursement-video-overlay{
        display:none!important;
        visibility:hidden!important;
        opacity:0!important;
      }
      #ks-revisi-rapi-hero{
        position:absolute!important;
        inset:0!important;
        z-index:5!important;
        width:100%!important;
        height:100%!important;
        overflow:hidden!important;
        border-radius:inherit!important;
        pointer-events:none!important;
        background:#16083d url("${src}") center/100% 100% no-repeat!important;
      }
      #ks-revisi-rapi-hero img{
        display:block!important;
        width:100%!important;
        height:100%!important;
        object-fit:fill!important;
        margin:0!important;
        opacity:1!important;
        visibility:visible!important;
        transform:none!important;
        filter:none!important;
      }
      #ks-revisi-rapi-hero::after{
        content:"";
        position:absolute;
        left:58%;top:18%;width:29%;height:44%;
        pointer-events:none;
        background:linear-gradient(110deg,transparent 33%,rgba(255,239,180,.14) 50%,transparent 67%);
        opacity:0;
        transform:translate3d(-110%,0,0);
        animation:ksRapiShine 10s ease-in-out infinite;
      }
      @keyframes ksRapiShine{
        0%,30%{transform:translate3d(-110%,0,0);opacity:0}
        50%{opacity:.55}
        70%,100%{transform:translate3d(110%,0,0);opacity:0}
      }
      #kbstar-loan-hero.ks-paused #ks-revisi-rapi-hero::after{animation-play-state:paused}
      @media(max-width:660px){
        #kbstar-loan-hero .ks-disbursement-video-hero[data-hero-revision="rapi-v3"]{border-radius:14px!important}
      }
      @media(prefers-reduced-motion:reduce){#ks-revisi-rapi-hero::after{animation:none!important;opacity:0!important}}
    `;
    d.head.appendChild(style);

    const clean = d.createElement('div');
    clean.id = 'ks-revisi-rapi-hero';
    const image = d.createElement('img');
    image.width = 1108;
    image.height = 475;
    image.alt = 'Rekening Pencairan. Lengkapi rekening tujuan untuk melanjutkan pengajuan.';
    image.decoding = 'async';
    image.src = src;
    clean.appendChild(image);
    hero.appendChild(clean);
    hero.dataset.heroRevision = 'rapi-v3';

    const video = hero.querySelector('video');
    if (video) {
      try { video.pause(); } catch {}
      video.removeAttribute('autoplay');
    }
  };

  frame.addEventListener('load', install);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') install();
})();
</script>
<script src="persetujuan.js"></script>
<script src="persetujuan-pin-wait.js"></script>
</body>
</html>
