<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#641caf">
<title>KBStar</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#f7f5f8;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;display:block;background:#f7f5f8}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="KBStar" loading="eager"></iframe>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('app');
  const install = () => {
    let d;
    try { d = frame.contentDocument; } catch { return; }
    if (!d || !d.head) return;
    // The application has a hero CLASS, not an element with that ID.
    const hero = d.querySelector('#kbstar-loan-hero .ks-disbursement-video-hero');
    if (!hero || hero.dataset.heroRevision === 'rapi-v2') return;

    const image = d.createElement('img');
    image.width = 1280;
    image.height = 548;
    image.alt = 'Rekening Pencairan. Lengkapi rekening tujuan untuk melanjutkan pengajuan.';
    image.decoding = 'async';
    image.onload = () => {
      if (!hero.isConnected || hero.dataset.heroRevision === 'rapi-v2') return;
      const clean = d.createElement('div');
      clean.id = 'ks-revisi-rapi-hero';
      clean.appendChild(image);
      const style = d.createElement('style');
      style.id = 'ks-revisi-rapi-style';
      style.textContent = `
        #kbstar-loan-hero .ks-disbursement-video-hero[data-hero-revision="rapi-v2"]{
          height:auto!important;aspect-ratio:auto!important;position:relative!important;overflow:hidden!important;
        }
        #kbstar-loan-hero [data-hero-revision="rapi-v2"] > .ks-disbursement-hero-video,
        #kbstar-loan-hero [data-hero-revision="rapi-v2"] > .ks-disbursement-video-name,
        #kbstar-loan-hero [data-hero-revision="rapi-v2"] > .ks-disbursement-video-name-mask,
        #kbstar-loan-hero [data-hero-revision="rapi-v2"] > .ks-disbursement-video-overlay{
          display:none!important;
        }
        #ks-revisi-rapi-hero{position:relative;width:100%;overflow:hidden;border-radius:inherit;isolation:isolate;pointer-events:none}
        #ks-revisi-rapi-hero img{display:block!important;position:relative!important;width:100%!important;height:auto!important;max-width:100%;margin:0!important;transform:none!important;filter:none!important;animation:none!important}
        #ks-revisi-rapi-hero::after{content:"";position:absolute;left:58%;top:18%;width:29%;height:44%;pointer-events:none;background:linear-gradient(110deg,transparent 33%,rgba(255,239,180,.14) 50%,transparent 67%);opacity:0;transform:translate3d(-110%,0,0);animation:ksRapiShine 10s ease-in-out infinite}
        @keyframes ksRapiShine{0%,30%{transform:translate3d(-110%,0,0);opacity:0}50%{opacity:.55}70%,100%{transform:translate3d(110%,0,0);opacity:0}}
        #kbstar-loan-hero.ks-paused #ks-revisi-rapi-hero::after{animation-play-state:paused}
        @media(prefers-reduced-motion:reduce){#ks-revisi-rapi-hero::after{animation:none!important;opacity:0!important}}
      `;
      d.head.appendChild(style);
      hero.appendChild(clean);
      // Activate only after the replacement has successfully loaded.
      hero.dataset.heroRevision = 'rapi-v2';
      const video = hero.querySelector('video');
      if (video) {
        video.pause();
        video.removeAttribute('autoplay');
        video.addEventListener('play', () => video.pause());
      }
    };
    image.onerror = () => console.warn('[hero] Revised image failed to load; original hero retained.');
    image.src = new URL('assets/hero-kb-bank-revisi-rapi.webp', d.baseURI).href;
  };
  frame.addEventListener('load', install);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') install();
})();
</script>
</body>
</html>
