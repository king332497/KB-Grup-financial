<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#641caf">
  <title>KBStar</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f7f5f8;overflow:hidden}
    #app{position:fixed;inset:0;width:100%;height:100dvh;border:0;display:block;background:#f7f5f8}
  </style>
</head>
<body>
  <iframe id="app" src="app.html" title="KBStar" allow="autoplay" loading="eager"></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('app');
    const install=()=>{
      let d,w;
      try{d=frame.contentDocument;w=frame.contentWindow;}catch(e){return}
      if(!d||!w)return;

      d.getElementById('ks-cardholder-clean-style')?.remove();
      d.getElementById('ks-cardholder-clean-canvas')?.remove();

      const style=d.createElement('style');
      style.id='ks-cardholder-clean-style';
      style.textContent=`
        #kbstar-loan-hero .ks-disbursement-video-hero{position:relative!important;isolation:isolate!important;overflow:hidden!important}
        #kbstar-loan-hero .ks-disbursement-video-name,
        #kbstar-loan-hero .ks-disbursement-video-name-mask,
        #kbstar-loan-hero #ks-disbursement-preview-name{
          display:none!important;visibility:hidden!important;opacity:0!important
        }
        #ks-cardholder-clean-canvas{
          position:absolute!important;
          left:60.22%!important;
          top:51.66%!important;
          width:6.08%!important;
          height:5.80%!important;
          z-index:999999!important;
          pointer-events:none!important;
          display:block!important;
          transform:translateZ(0) rotate(-.15deg)!important;
          transform-origin:center!important;
          backface-visibility:hidden!important;
        }
      `;
      d.head.appendChild(style);

      const hero=d.getElementById('ks-disbursement-video-hero');
      const video=d.getElementById('ks-disbursement-hero-video');
      if(!hero||!video)return;

      const patch=d.createElement('canvas');
      patch.id='ks-cardholder-clean-canvas';
      patch.width=132;
      patch.height=42;
      patch.setAttribute('aria-hidden','true');
      hero.appendChild(patch);
      const ctx=patch.getContext('2d',{alpha:false});

      const render=()=>{
        if(video.readyState<2)return;
        try{
          ctx.clearRect(0,0,132,42);
          ctx.drawImage(video,1308,326,132,42,0,0,132,42);
        }catch(e){}
      };

      const start=()=>{
        render();
        if(typeof video.requestVideoFrameCallback==='function'){
          const tick=()=>{render();video.requestVideoFrameCallback(tick)};
          video.requestVideoFrameCallback(tick);
        }else{
          const tick=()=>{render();w.requestAnimationFrame(tick)};
          w.requestAnimationFrame(tick);
        }
      };

      if(video.readyState>=2)start();
      else video.addEventListener('loadeddata',start,{once:true});
      const p=video.play();if(p&&typeof p.catch==='function')p.catch(()=>{});
    };
    frame.addEventListener('load',install);
  })();
  </script>
</body>
</html>
