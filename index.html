<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#641caf">
<title>KBStar</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#f7f5f8;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;display:block;background:#f7f5f8}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="KBStar" loading="eager" allow="autoplay"></iframe>
<script src="persetujuan.js"></script>
<script src="persetujuan-pin-wait.js"></script>
<script src="waiting-hero-premium.js"></script>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('app');
  if (!frame) return;

  const installDisbursementHero = () => {
    let d;
    try { d = frame.contentDocument; } catch { return; }
    if (!d || !d.body) return;

    const apply = () => {
      const page = d.querySelector('#ks-disbursement-account');
      const hero = page?.querySelector('.ks-disbursement-video-hero');
      const video = page?.querySelector('#ks-disbursement-hero-video');
      if (!page || !hero || !video) return false;
      if (hero.dataset.premiumHeroInstalled === 'bright-v2') return true;

      video.pause?.();
      video.removeAttribute('autoplay');
      video.removeAttribute('src');
      video.innerHTML = '';
      video.style.display = 'none';

      hero.dataset.premiumHeroInstalled = 'bright-v2';
      hero.classList.add('ks-premium-disbursement-hero');
      hero.querySelectorAll('.ks-premium-disbursement-visual').forEach(el => el.remove());

      const visual = d.createElement('div');
      visual.className = 'ks-premium-disbursement-visual';
      visual.setAttribute('aria-hidden','true');
      const img = d.createElement('img');
      img.src = new URL('assets/hero-kb-bank-clean-latest.webp?v=bright-v2-20260912', d.baseURI).href;
      img.alt = '';
      visual.appendChild(img);
      hero.appendChild(visual);

      d.getElementById('ks-premium-disbursement-style')?.remove();
      const style = d.createElement('style');
      style.id = 'ks-premium-disbursement-style';
      style.textContent = `
        #ks-disbursement-account .ks-premium-disbursement-hero{
          position:relative;overflow:hidden;min-height:240px;border-radius:24px;
          background:linear-gradient(135deg,#fff8df 0%,#ffe59a 38%,#fff4d0 64%,#f7c94c 100%);
          isolation:isolate;
          box-shadow:0 20px 52px rgba(176,117,14,.22),0 0 0 1px rgba(238,185,55,.22) inset;
        }
        #ks-disbursement-account .ks-premium-disbursement-visual{
          position:absolute;inset:0;overflow:hidden;transform:translateZ(0);
          background:linear-gradient(135deg,#fff9e8,#ffe9a8 55%,#fff6d8);
        }
        #ks-disbursement-account .ks-premium-disbursement-visual img{
          width:100%;height:100%;object-fit:cover;object-position:center;display:block;
          filter:brightness(1.42) saturate(1.12) contrast(.94) sepia(.06);
          transform:scale(1.015) translate3d(0,0,0);
          animation:ksDisbursementKenBurns 14s cubic-bezier(.4,0,.2,1) infinite alternate;
          will-change:transform,filter;backface-visibility:hidden;
        }
        #ks-disbursement-account .ks-premium-disbursement-hero::before{
          content:"";position:absolute;inset:-35% -25%;z-index:2;pointer-events:none;
          background:linear-gradient(112deg,transparent 41%,rgba(255,255,255,.10) 46%,rgba(255,238,168,.58) 50%,rgba(255,255,255,.13) 54%,transparent 59%);
          transform:translate3d(-48%,0,0);animation:ksDisbursementSweep 7.2s ease-in-out infinite;
          mix-blend-mode:screen;
        }
        #ks-disbursement-account .ks-premium-disbursement-hero::after{
          content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
          background:
            radial-gradient(circle at 72% 42%,rgba(255,229,120,.28),transparent 30%),
            linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,244,205,.04));
          animation:ksDisbursementGlow 4.8s ease-in-out infinite;
          mix-blend-mode:screen;
        }
        @keyframes ksDisbursementKenBurns{
          0%{transform:scale(1.015) translate3d(-.4%,0,0);filter:brightness(1.36) saturate(1.10) contrast(.95)}
          50%{transform:scale(1.045) translate3d(.8%,-.5%,0);filter:brightness(1.48) saturate(1.15) contrast(.93)}
          100%{transform:scale(1.025) translate3d(-.2%,.5%,0);filter:brightness(1.40) saturate(1.12) contrast(.94)}
        }
        @keyframes ksDisbursementSweep{
          0%,18%{transform:translate3d(-52%,0,0);opacity:0}
          45%{opacity:1}
          72%,100%{transform:translate3d(52%,0,0);opacity:0}
        }
        @keyframes ksDisbursementGlow{
          0%,100%{opacity:.55}
          50%{opacity:1}
        }
        @media(max-width:430px){
          #ks-disbursement-account .ks-premium-disbursement-hero{min-height:205px;border-radius:20px}
          #ks-disbursement-account .ks-premium-disbursement-visual img{
            object-position:56% center;
            animation-duration:16s;
            filter:brightness(1.46) saturate(1.12) contrast(.93);
          }
        }
        @media(prefers-reduced-motion:reduce){
          #ks-disbursement-account .ks-premium-disbursement-visual img,
          #ks-disbursement-account .ks-premium-disbursement-hero::before,
          #ks-disbursement-account .ks-premium-disbursement-hero::after{animation:none!important}
        }
      `;
      d.head.appendChild(style);
      return true;
    };

    if (apply()) return;
    const observer = new MutationObserver(() => {
      if (apply()) observer.disconnect();
    });
    observer.observe(d.body,{subtree:true,childList:true});
    d.defaultView?.setTimeout(() => observer.disconnect(),10000);
  };

  frame.addEventListener('load', installDisbursementHero);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') installDisbursementHero();
})();
</script>
</body>
</html>
