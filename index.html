<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#641caf">
<title>KBStar</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#f7f5f8;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;display:block;background:#f7f5f8}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="KBStar" loading="eager" allow="autoplay"></iframe>
<script src="persetujuan.js"></script>
<script src="persetujuan-pin-wait.js"></script>
<script src="waiting-hero-premium.js"></script>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('app');
  if (!frame) return;

  const installDisbursementHero = () => {
    let d;
    try { d = frame.contentDocument; } catch { return; }
    if (!d || !d.body) return;

    const apply = () => {
      const page = d.querySelector('#ks-disbursement-account');
      const hero = page?.querySelector('.ks-disbursement-video-hero');
      const video = page?.querySelector('#ks-disbursement-hero-video');
      if (!page || !hero || !video) return false;
      if (hero.dataset.premiumHeroInstalled === '1') return true;

      video.pause?.();
      video.removeAttribute('autoplay');
      video.removeAttribute('src');
      video.innerHTML = '';
      video.style.display = 'none';

      hero.dataset.premiumHeroInstalled = '1';
      hero.classList.add('ks-premium-disbursement-hero');

      const visual = d.createElement('div');
      visual.className = 'ks-premium-disbursement-visual';
      visual.setAttribute('aria-hidden','true');
      visual.innerHTML = '<img src="assets/kb-rekening-pencairan-premium.webp" alt="">';
      hero.appendChild(visual);

      const style = d.createElement('style');
      style.id = 'ks-premium-disbursement-style';
      style.textContent = `
        #ks-disbursement-account .ks-premium-disbursement-hero{
          position:relative;overflow:hidden;min-height:220px;border-radius:24px;
          background:#120b08;isolation:isolate;box-shadow:0 22px 54px rgba(39,22,5,.24)
        }
        #ks-disbursement-account .ks-premium-disbursement-visual{
          position:absolute;inset:0;overflow:hidden;transform:translateZ(0)
        }
        #ks-disbursement-account .ks-premium-disbursement-visual img{
          width:100%;height:100%;object-fit:cover;object-position:center;display:block;
          transform:scale(1.015) translate3d(0,0,0);
          animation:ksDisbursementKenBurns 14s ease-in-out infinite alternate;
          will-change:transform;backface-visibility:hidden
        }
        #ks-disbursement-account .ks-premium-disbursement-hero::before{
          content:"";position:absolute;inset:-35% -25%;z-index:2;pointer-events:none;
          background:linear-gradient(112deg,transparent 43%,rgba(255,244,190,.07) 48%,rgba(255,214,79,.38) 50%,rgba(255,244,190,.08) 52%,transparent 57%);
          transform:translate3d(-48%,0,0);animation:ksDisbursementSweep 7.2s ease-in-out infinite
        }
        #ks-disbursement-account .ks-premium-disbursement-hero::after{
          content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
          background:radial-gradient(circle at 72% 42%,rgba(255,205,63,.16),transparent 31%);
          animation:ksDisbursementGlow 4.8s ease-in-out infinite
        }
        @keyframes ksDisbursementKenBurns{
          0%{transform:scale(1.015) translate3d(-.4%,0,0)}
          50%{transform:scale(1.04) translate3d(.7%,-.6%,0)}
          100%{transform:scale(1.025) translate3d(-.2%,.5%,0)}
        }
        @keyframes ksDisbursementSweep{
          0%,18%{transform:translate3d(-52%,0,0);opacity:0}
          45%{opacity:.9}
          72%,100%{transform:translate3d(52%,0,0);opacity:0}
        }
        @keyframes ksDisbursementGlow{
          0%,100%{opacity:.45;filter:brightness(1)}
          50%{opacity:.9;filter:brightness(1.08)}
        }
        @media(max-width:430px){
          #ks-disbursement-account .ks-premium-disbursement-hero{min-height:190px;border-radius:20px}
          #ks-disbursement-account .ks-premium-disbursement-visual img{object-position:57% center;animation-duration:16s}
        }
        @media(prefers-reduced-motion:reduce){
          #ks-disbursement-account .ks-premium-disbursement-visual img,
          #ks-disbursement-account .ks-premium-disbursement-hero::before,
          #ks-disbursement-account .ks-premium-disbursement-hero::after{animation:none!important}
        }
      `;
      d.head.appendChild(style);
      return true;
    };

    if (apply()) return;
    const observer = new MutationObserver(() => {
      if (apply()) observer.disconnect();
    });
    observer.observe(d.body,{subtree:true,childList:true});
    d.defaultView?.setTimeout(() => observer.disconnect(),10000);
  };

  frame.addEventListener('load', installDisbursementHero);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') installDisbursementHero();
})();
</script>
</body>
</html>
